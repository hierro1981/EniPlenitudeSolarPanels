name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      notes: ${{ steps.metadata.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate release metadata and availability
        id: metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const defaultBranch = context.payload.repository.default_branch;
            if (context.ref !== `refs/heads/${defaultBranch}`) {
              throw new Error(`Avvia la pubblicazione dal ramo predefinito: ${defaultBranch}`);
            }

            const component = 'custom_components/plenitude_panels';
            const manifest = JSON.parse(fs.readFileSync(`${component}/manifest.json`, 'utf8'));
            const changelog = fs.readFileSync(`${component}/CHANGELOG.md`, 'utf8');
            const headings = [...changelog.matchAll(/^## ([^\r\n]+)\r?$/gm)];
            const latest = headings[0];
            if (!/^\d+\.\d+\.\d+$/.test(manifest.version) || latest?.[1] !== manifest.version) {
              throw new Error('Manifest e prima versione del changelog devono coincidere (X.Y.Z).');
            }
            const notes = changelog.slice(latest.index + latest[0].length, headings[1]?.index).trim();
            if (!notes) {
              throw new Error('Il changelog della release non contiene note.');
            }

            const tag = `v${manifest.version}`;
            for (const lookup of [
              () => github.rest.git.getRef({...context.repo, ref: `tags/${tag}`}),
              () => github.rest.repos.getReleaseByTag({...context.repo, tag}),
            ]) {
              let exists = false;
              try {
                await lookup();
                exists = true;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (exists) throw new Error(`Tag o release ${tag} già presente: incrementa la versione.`);
            }
            core.setOutput('tag', tag);
            core.setOutput('notes', notes);

  hacs:
    name: HACS
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests (Home Assistant 2025.10.4)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  release:
    name: Publish validated release
    needs: [prepare, hacs, hassfest, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and GitHub release on the validated commit
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
        with:
          script: |
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: context.sha,
              name: process.env.RELEASE_TAG,
              body: process.env.RELEASE_NOTES,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.info(`Release pubblicata: ${release.html_url}`);
